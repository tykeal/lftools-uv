[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lftools-uv"
dynamic = ["version"]
description = "Linux Foundation Release Engineering Tools"
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = {text = "EPL-1.0 OR Apache-2.0"}

authors = [
    {name = "LF Release Engineering", email = "releng@linuxfoundation.org"},
]

maintainers = [
    {name = "LF Release Engineering", email = "releng@linuxfoundation.org"},
]

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Eclipse Public License 1.0 (EPL-1.0)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "attrs",
    "beautifulsoup4",
    "boto3",
    "certifi",
    "cfgv",
    "click",
    "defusedxml",
    "Deprecated",
    "dnspython",
    "docker",
    "email-validator",
    "filelock",
    "GitPython",
    "identify",
    "idna",
    "jinja2",
    "jsonschema",
    "lxml",
    "nodeenv",
    "openstacksdk>=4.0.0,<5.0.0",
    "pbr",
    "pygerrit2",
    "PyGithub",
    "PyJWT",
    "python-jenkins",
    "PyYAML",
    "requests>=2.32.0",
    "ruamel.yaml",
    "ruamel.yaml.clib>=0.2.15",
    "soupsieve",
    "tabulate",
    "tqdm",
    "typer",
    "urllib3>=2.6.3,<3.0.0",
    "websocket-client",
    "wrapt",
    "platformdirs",
    "google-auth",
    "google-auth-oauthlib",
    # Security: pyasn1>=0.6.2 fixes DoS vulnerability in decoder
    "pyasn1>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "tox",
    "ruff",
    "bandit",
    "safety",
    "types-requests",
    "types-PyYAML",
    "types-tabulate",
    "types-jsonschema",
    "types-tqdm",
    "boto3-stubs",
    "types-Deprecated"
]




docs = [
    "sphinxcontrib-programoutput",
    "sphinx>=4.0.0",
    "furo"
]

ldap = [
    "python-ldap>=3.4,<4.0"
]

openstack = [
    "osc-lib>=2.2,<4.6"
]

test = [
    "pytest>=8.3.0",
    "pytest-click>=1.1.0",
    "pytest-cov>=5.0.0",
    "pytest-datafiles>=3.0.0",
    "pytest-mock>=3.14.0",
    "pytest-responses>=0.5.1",
    "responses>=0.25.0"
]

# Combined extra for development work
all = [
    "lftools-uv[dev,ldap,openstack,test]"
]

[project.urls]
"Homepage" = "https://lftools-uv.readthedocs.io/"
"Bug Tracker" = "https://github.com/lfreleng-actions/lftools-uv/issues"
"Documentation" = "https://lftools-uv.readthedocs.io/"
"GitHub Pages" = "https://lfreleng-actions.github.io/lftools-uv/"
"Source Code" = "https://github.com/lfreleng-actions/lftools-uv"
"Repository" = "https://github.com/lfreleng-actions/lftools-uv"
"Changelog" = "https://github.com/lfreleng-actions/lftools-uv/releases"

[project.scripts]
lftools-uv = "lftools_uv.cli:main"
autocorrectinfofile = "lftools_uv.shell.autocorrectinfofile:main"
deploy = "lftools_uv.shell.deploy:main"
fix_yamllint = "lftools_uv.shell.fix_yamllint:main"
gerrit_create = "lftools_uv.shell.gerrit_create:main"
inactivecommitters = "lftools_uv.shell.inactivecommitters:main"
sign = "lftools_uv.shell.sign:main"
version = "lftools_uv.shell.version:main"
yaml4info = "lftools_uv.shell.yaml4info:main"



[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "python-simplified-semver"

[tool.hatch.build.targets.wheel]
packages = ["lftools_uv"]

[tool.hatch.build.targets.sdist]
include = [
    "/lftools_uv",
    "/shell",
    "/docs",
    "/tests",
    "/README.md",
    "/pyproject.toml"
]
exclude = [
    "/.git*",
    "/.tox",
    "/.pytest_cache",
    "/__pycache__",
    "*.pyc",
    "*.pyo"
]

[tool.hatch.build.targets.wheel.shared-data]
"shell" = "share/lftools-uv/shell"

# Removed [tool.black] section (ruff now provides formatting via ruff format)

# Removed [tool.isort] section (ruff handles import sorting)

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "botocore.*",
    "boto3.*",
    "defusedxml.minidom.*",
    "docker.*",
    "email_validator.*",
    "git.*",
    "jenkins.*",
    "ldap.*",
    "openstack.*",
    "platformdirs.*",
    "pygerrit2.*",
    "ruamel.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["datafiles"]
addopts = [
    "-p", "no:warnings",
    "--cov=lftools_uv",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["lftools_uv"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lftools_uv"]

[tool.uv]
constraint-dependencies = [
    # Security: force minimum versions for transitive dependencies
    # Fixes CVE-2026-27962, CVE-2026-28490, CVE-2026-28498, CVE-2026-28802
    "authlib>=1.6.9",
    # Fixes CVE-2026-26007 (subgroup attack on SECT curves)
    "cryptography>=46.0.5",
    # Fixes CVE-2025-14009 (Zip Slip) and CVE-2026-33230 (XSS)
    "nltk>=3.9.4",
    # Bump transitive dependency to latest stable
    "pygments>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-responses>=0.5.1",
    "responses>=0.25.0",
]
